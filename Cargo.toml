[package]
name = "cbgpu-latex"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"

[dependencies]
hmac = "0.12"
getrandom = "0.3"
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "deflate"] }
tokio-tungstenite = "0.28"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "sqlite", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
subtle = "2"
regex = "1"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
zip = { version = "9.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
tempfile = "3"
fs2 = "0.4"
libc = "0.2"
percent-encoding = "2"
url = "2"

tower = { version = "0.5", features = ["util"] }

rusqlite = { version = "0.32", features = ["backup", "bundled"] }
libloading = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
